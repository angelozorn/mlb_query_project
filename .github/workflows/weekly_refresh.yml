name: Weekly Statcast Data Refresh

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd data_pipeline
          pip install -r requirements.txt

      - name: Run weekly refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd data_pipeline
          python pull_statcast.py --mode refresh

      # Scheduled workflows are auto-disabled after 60 days without repo activity;
      # re-enabling on every scheduled run resets that clock.
      - name: Keep scheduled workflow enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable weekly_refresh.yml
